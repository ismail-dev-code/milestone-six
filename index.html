<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Janala</title>
    <!-- google fonts  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- tailwind and daisyUI cdn -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awesome cdn  -->
    <script
      src="https://kit.fontawesome.com/1632af40cc.js"
      crossorigin="anonymous"
    ></script>
    <!-- sweetAlert cdn  -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      .font-poppins {
        font-family: "Poppins", sans-serif;
      }
      .font-siliguri {
        font-family: "Hind Siliguri", sans-serif;
      }
      
      .btnPrimary{
        background-color: #422AD5;
        color: white;
      }
     
    </style>
  </head>
  <body class="font-poppins">
    <header class="border-b-1 border-b-gray-300">
      <nav class="flex justify-between w-11/12 mx-auto py-3">
        <div class="logo flex items-center">
            <h1 class="text-xl font-semibold">English</h1>
            <img src="./assets/logo.png" alt="logo img loading">
            <h1 class="text-xl font-semibold">Bengali</h1>
        </div>
        <div class="nav-btn flex gap-3">
          <button class="btn  text-[#422AD5] border-[#422AD5] hover:bg-[#422AD5] hover:text-white">FAQ</button><button class="btn  text-[#422AD5] border-[#422AD5] hover:bg-[#422AD5] hover:text-white">Learn</button
          ><button class="btn text-[#422AD5] border-[#422AD5] hover:bg-[#422AD5] hover:text-white">Logout</button>
        </div>
      </nav>
    </header>
 <main class="w-10/12 mx-auto mt-12">
    <div class="banner flex justify-between items-center">
        <div class="bannerTitle flex-1">
            <h1 class="text-3xl font-semibold py-3"><span class="text-[#422AD5]">English</span> is Easy</h1>
            <p>আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন। আপনি যদি নতুন হন অথবা আপনার দক্ষতা বাড়াতে চান, আমাদের Interactive Lessons আপনাকে নিয়ে যাবে অন্য একটি Level এ</p>
           <div class="flex flex-col max-w-fit space-y-2 mb-1 mt-4">
            <input class="rounded-sm pl-2 text-xl font-extralight" type="text" placeholder="Your Name">
            <input class="rounded-sm pl-2 text-xl font-extralight" type="password" placeholder="Password">
           </div>
            <button class="btn bg-[#422AD5] text-white">Get Started</button>
        </div>
        <div class="bannerImg flex-1 flex justify-end">
            <img src="./assets/faisalwheelpic_dotted.png" alt="">
        </div>
    </div>
    <section>
        <div class="learn flex flex-col gap-3 items-center justify-center">
            <h1 class="text-2xl font-semibold text-center"><span class="text-blue-600">Let's</span> Learn Vocabularies</h1>
            <div id="learnBtns" class="flex gap-2">

            </div>
          </div>
        </section>
        <div id="lessonCard" class="grid grid-cols-3 gap-4">

        </div>
 </main>
 <script src="./index.js"></script>
  </body>
</html>
